services:
  product-service:
    build:
      context: ./product-service
    ports:
      - "8081:8081"
    networks:
      - store-network

  order-service:
    build:
      context: ./order-service
    ports:
      - "8082:8082"
    networks:
      - store-network

  inventory-service:
    build:
      context: ./inventory-service
    ports:
      - "8083:8083"
    networks:
      - store-network

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - product-service
      - order-service
      - inventory-service
    networks:
      - store-network

networks:
  store-network:
    driver: bridge
