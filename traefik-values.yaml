deployment:
  replicas: 1

nodeSelector:
  node-role.kubernetes.io/control-plane: ""

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

service:
  type: ClusterIP

ports:
  web:
    port: 80
    hostPort: 80
    expose:
      default: true

  websecure:
    port: 443
    hostPort: 443
    expose:
      default: true

providers:
  kubernetesIngress:
    enabled: true

ingressClass:
  enabled: true
  name: traefik
