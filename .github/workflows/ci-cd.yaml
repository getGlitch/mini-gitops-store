name: Build, Publish and Update GitOps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/getglitch/mini-gitops-store

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
          - service: product-service
          - service: order-service
          - service: inventory-service

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}

  update-gitops:
    runs-on: ubuntu-latest
    needs: build-and-publish

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: getGlitch/mini-gitops-store-gitiops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update Helm image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd gitops/charts/mini-gitops-store

          sed -i "s|^\([[:space:]]*frontend:[[:space:]]*\).*|\1ghcr.io/getglitch/mini-gitops-store-frontend:${IMAGE_TAG}|" values.yaml
          sed -i "s|^\([[:space:]]*product:[[:space:]]*\).*|\1ghcr.io/getglitch/mini-gitops-store-product-service:${IMAGE_TAG}|" values.yaml
          sed -i "s|^\([[:space:]]*order:[[:space:]]*\).*|\1ghcr.io/getglitch/mini-gitops-store-order-service:${IMAGE_TAG}|" values.yaml
          sed -i "s|^\([[:space:]]*inventory:[[:space:]]*\).*|\1ghcr.io/getglitch/mini-gitops-store-inventory-service:${IMAGE_TAG}|" values.yaml

          cat values.yaml

      - name: Commit and push GitOps update
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/mini-gitops-store/values.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
          else
            git commit -m "deploy: update images to ${GITHUB_SHA}"
            git push origin HEAD:main
          fi
